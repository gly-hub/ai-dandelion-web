<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .test-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      height: 100vh;
      width: 100vw;
      background: #f5f5f5;
    }

    .test-sidebar {
      background: #e0e0e0;
      padding: 20px;
      border-right: 1px solid #ccc;
    }

    .test-main {
      display: grid;
      grid-template-columns: 45fr 55fr;
      gap: 12px;
      padding: 12px;
      background: #fff;
    }

    .test-main.preview-mode {
      grid-template-columns: 1fr;
      padding: 0;
      gap: 0;
    }

    .test-content,
    .test-chat {
      background: #d0d0d0;
      padding: 20px;
      border: 2px solid #999;
      min-height: 0;
      overflow: auto;
    }

    .test-content {
      background: #ffebee;
      border-color: #c62828;
    }

    .test-chat {
      background: #e3f2fd;
      border-color: #1565c0;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="test-layout">
    <div class="test-sidebar">
      <h2>左侧流程栏 (240px)</h2>
      <button onclick="togglePreview()">切换预览模式</button>
      <p style="margin-top: 20px;">这是固定宽度的侧边栏</p>
    </div>

    <div class="test-main" id="mainArea">
      <div class="test-content">
        <h3>内容区 (45%)</h3>
        <p>这应该占据右侧的 45%</p>
        <div style="height: 2000px; background: linear-gradient(#ffebee, #fff);">
          滚动内容区域
        </div>
      </div>

      <div class="test-chat" id="chatArea">
        <h3>对话框区 (55%)</h3>
        <p>这应该占据右侧的 55%</p>
        <div style="height: 2000px; background: linear-gradient(#e3f2fd, #fff);">
          滚动对话区域
        </div>
      </div>
    </div>
  </div>

  <script>
    let isPreview = false;

    function togglePreview() {
      isPreview = !isPreview;
      const mainArea = document.getElementById('mainArea');
      const chatArea = document.getElementById('chatArea');

      if (isPreview) {
        mainArea.classList.add('preview-mode');
        chatArea.style.display = 'none';
      } else {
        mainArea.classList.remove('preview-mode');
        chatArea.style.display = 'block';
      }
    }
  </script>
</body>
</html>
